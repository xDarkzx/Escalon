name: Wrong answer or action
description: The agent answered when it should have escalated, or the reverse, or cited the wrong article
labels: [agent-behaviour]
body:
  - type: textarea
    id: question
    attributes:
      label: What the user asked
    validations:
      required: true
  - type: textarea
    id: reply
    attributes:
      label: What the agent did
      description: The reply, and any ticket it created.
    validations:
      required: true
  - type: dropdown
    id: expected
    attributes:
      label: What it should have done
      options: [answer from an article, escalate to a ticket, ask a clarifying question]
    validations:
      required: true
  - type: input
    id: article
    attributes:
      label: The article that answers it, if any
